<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المحرر الذكي للمستندات</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Cairo', sans-serif; background-color: #f8f9fa; color: #000; direction: rtl; }

        .app-container { display: flex; flex-direction: column; min-height: 100vh; padding: 15px; max-width: 1300px; margin: 0 auto; gap: 15px; }
        
        header { background: #111; color: #fff; padding: 15px; border-radius: 8px; text-align: center; }
        header h1 { font-size: 1.3rem; margin-bottom: 4px; }
        header p { font-size: 0.85rem; color: #aaa; }

        .main-content { display: flex; flex-direction: column; gap: 15px; }
        @media (min-width: 992px) {
            .main-content { display: grid; grid-template-columns: 420px 1fr; align-items: start; }
        }

        .panel { background: #fff; padding: 15px; border-radius: 8px; border: 1px solid #e0e0e0; }
        .section-title { font-size: 1rem; font-weight: 700; margin-bottom: 10px; border-bottom: 2px solid #000; padding-bottom: 4px; }

        .templates-container { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
        .btn-template { background: #f0f0f0; color: #000; border: 1px solid #ccc; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; font-family: inherit; font-weight: 600; }
        .btn-template:hover { background: #000; color: #fff; }

        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 4px; }
        select, textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-family: inherit; font-size: 0.9rem; }
        textarea { height: 220px; resize: vertical; line-height: 1.5; }

        .actions-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
        .btn { padding: 10px; border: none; border-radius: 4px; cursor: pointer; font-weight: 700; font-size: 0.9rem; font-family: inherit; text-align: center; }
        .btn-word { background: #000; color: #fff; }
        .btn-word:hover { background: #333; }
        .btn-pdf { background: #333; color: #fff; }
        .btn-pdf:hover { background: #555; }

        /* معاينة المستند */
        .preview-wrapper { background: #666; padding: 10px; border-radius: 8px; overflow-x: auto; display: flex; justify-content: center; }
        .paper { background: #fff; color: #000; width: 100%; max-width: 210mm; min-height: 297mm; padding: 20mm 18mm; border: 1px solid #999; box-sizing: border-box; }

        /* عناصر النص داخل الورقة */
        .doc-title { text-align: center; font-size: 17pt; font-weight: bold; margin-bottom: 18px; border-bottom: 2px solid #000; padding-bottom: 6px; }
        .doc-heading { font-size: 13.5pt; font-weight: bold; margin-top: 14px; margin-bottom: 6px; text-decoration: underline; page-break-after: avoid; }
        .doc-paragraph { font-size: 12pt; line-height: 1.6; text-align: justify; text-justify: inter-word; text-indent: 0.8cm; margin-bottom: 6px; }
        .doc-term { font-size: 12pt; line-height: 1.5; margin-bottom: 6px; text-align: justify; }
        .doc-term-bold { font-weight: bold; }
        .doc-closing { text-align: left; font-weight: bold; font-size: 12.5pt; margin-top: 22px; page-break-inside: avoid; }

        /* إعدادات الطباعة ومنع ظهور صفحات إضافية */
        @media print {
            body { background: #fff; }
            .app-container, .main-content { display: block; padding: 0; margin: 0; }
            header, .panel { display: none !important; }
            .preview-wrapper { background: #fff; padding: 0; border-radius: 0; }
            .paper { border: none; width: 100%; max-width: none; min-height: auto; padding: 0; margin: 0; box-shadow: none; }
            @page { size: A4; margin: 2cm 1.5cm; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>⚖️ المنظم والمحرر الذكي للمستندات</h1>
        <p>تنسيق فوري للمذكرات والشكاوى والمصطلحات بأعلى معايير الطباعة أحادية اللون</p>
    </header>

    <div class="main-content">
        <!-- لوحة التحكم -->
        <div class="panel">
            <div class="section-title">⚡ نماذج تجريبية سريعة</div>
            <div class="templates-container">
                <button class="btn-template" onclick="loadTemplate('complaint')">📝 شكوى ضد زميل</button>
                <button class="btn-template" onclick="loadTemplate('defense')">⚖️ مذكرة دفاع</button>
                <button class="btn-template" onclick="loadTemplate('terms')">📚 مصطلحات وتعاريف</button>
                <button class="btn-template" onclick="loadTemplate('minutes')">📑 محضر اجتماع</button>
            </div>

            <div class="form-group">
                <label for="fontSelect">نوع الخط الكلاسيكي:</label>
                <select id="fontSelect" onchange="updatePreview()">
                    <option value="'Amiri', serif">Amiri (أميـري كلاسيك)</option>
                    <option value="'Tajawal', sans-serif">Tajawal (تجول حديث)</option>
                    <option value="'Cairo', sans-serif">Cairo (القاهرة واضح)</option>
                    <option value="'Traditional Arabic', serif">Traditional Arabic (التقليدي)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="inputText">النص المراد تنسيقه:</label>
                <textarea id="inputText" oninput="updatePreview()" placeholder="اكتب النص هنا أو اختر نموذجاً سريعاً..."></textarea>
            </div>

            <div class="actions-grid">
                <button class="btn btn-word" onclick="exportWord()">📄 تصدير Word</button>
                <button class="btn btn-pdf" onclick="exportPDF()">🖨️ طباعة / PDF</button>
            </div>
        </div>

        <!-- معاينة المستند -->
        <div class="preview-wrapper">
            <div id="paper" class="paper">
                <div id="docContent"></div>
            </div>
        </div>
    </div>
</div>

<script>
    const templates = {
        complaint: `مذكرة شكوى إدارية وأكاديمية\n\nالمرفوع إلى: أ.د. عميد الكلية المحترم\nمقدمة من الطالب: أحمد محمود (السنة الثالثة)\nضد الطالب: كريم خالد (السنة الثالثة)\n\nموضوع الشكوى:\nالتعدي على حقوق المشروع الجماعي وتكرار الإساءة السلوكية.\n\nأولاً: الوقائع\n1. بتاريخ 20 أكتوبر 2026، قام المشكو في حقه بالاستيلاء على الجزء البرمجي الخاص بي ونسبه لنفسه.\n2. عند محاولة النقاش معه هادئاً، قام بالتلفظ بعبارات غير لائقة أمام زملائنا.\n\nثانياً: الأسباب والمطالب\n- بناءً على لائحة الانضباط الطلابي بالجامعة المادة 12 الخاصة بانتهاك الأمانة الأكاديمية.\n\nثالثاً: الطلبات\nنلتمس من سيادتكم التكرم بـ:\n- إحالة الشكوى إلى لجنة الانضباط الطلابي.\n- التحقق من ملفات المشروع وإعادة التقييم الأكاديمي المستحق.\n\nتقبلوا بقبول فائق الاحترام والتقدير\nمقدمه الطالب: أحمد محمود`,
        defense: `مذكرة دفاع في الدعوى رقم 102 لسنة 2026\n\nالمرفوع إلى: عدالة المحكمة الموقرة\nمقدمة من: وكيل المدعى عليه\n\nأولاً: الدفع بعدم قبول الدعوى\nتأسساً على نص المادة 18 من قانون الإجراءات، حيث لم يقم المدعي بتقديم السند القانوني الضامن لطلبه.\n\nثانياً: عن الموضوع\nإن الوقائع الواردة بصحيفة الدعوى جاءت مرسلة ولا تسانده أي قرينة قانونية صحيحة.\n\nثالثاً: الطلبات\nنلتمس من المحكمة الموقرة:\n- رفض الدعوى وإلزام المدعي المصاريف.\n\nوكيل المدعى عليه: المحامي`,
        terms: `قائمة المصطلحات والتعاريف الأكاديمية\n\nالتحكيم التجاري: وسيلة بديلة لفض المنازعات بين الأطراف بواسطة محكمين يتم اختيارهم للفصل في النزاع.\nالعقد الأدبي: الاتفاق الذي يرتب التزامات اخلاقية دون اللجوء للقضاء.\nالقوة القاهرة: حدث استثنائي عام لا يمكن التنبؤ به يجعل تنفيذ الالتزام مستحيلاً.\n\nإعداد الطالب: أحمد محمود`,
        minutes: `محضر اجتماع لجنة التنسيق الأكاديمي\n\nالموضوع: تنظيم سير المحاضرات وحل مشكلات المنصة\n\nأولاً: الحضور\n- ممثل الدفعة وأعضاء اللجنة الموقرين.\n\nثانياً: القرارات والتوصيات\n1. اعتماد جدول المحاضرات الجديد اعتباراً من الأسبوع القادم.\n2. حل المشكلات التقنية المتعلقة بالوصول للمواد الدراسية.\n\nرئيس الجلسة: أدمن الدفعة`
    };

    function loadTemplate(key) {
        document.getElementById('inputText').value = templates[key];
        updatePreview();
    }

    function analyzeLine(line) {
        const text = line.trim();
        if (!text) return { type: 'EMPTY' };

        const titles = ['مذكرة', 'صحيفة', 'عقد', 'شكوى', 'محضر', 'قائمة', 'تقرير', 'بيان'];
        const headings = ['أولاً', 'ثانياً', 'ثالثاً', 'رابعاً', 'خامساً', 'الوقائع', 'الأسباب', 'الطلبات', 'الموضوع', 'الحضور', 'القرارات'];
        const closings = ['مقدمه', 'وكيل', 'المحامي', 'رئيس الجلسة', 'تقبلوا', 'والله ولي التوفيق'];

        if (titles.some(t => text.startsWith(t)) && text.length < 50) return { type: 'TITLE', text };
        if (headings.some(h => text.startsWith(h)) || text.endsWith(':')) return { type: 'HEADING', text };
        if (closings.some(c => text.startsWith(c))) return { type: 'CLOSING', text };
        
        if (text.includes(':') && !text.endsWith(':') && text.indexOf(':') < 35) {
            const parts = text.split(':');
            return { type: 'TERM', term: parts[0] + ':', desc: parts.slice(1).join(':') };
        }

        return { type: 'PARAGRAPH', text };
    }

    function updatePreview() {
        const text = document.getElementById('inputText').value;
        const font = document.getElementById('fontSelect').value;
        const container = document.getElementById('docContent');
        const paper = document.getElementById('paper');

        paper.style.fontFamily = font;
        container.innerHTML = '';

        if (!text.trim()) {
            container.innerHTML = '<p style="text-align:center; color:#888; margin-top:50px;">سيظهر التنسيق المباشر للمستند هنا...</p>';
            return;
        }

        const lines = text.split('\n');

        lines.forEach(line => {
            const parsed = analyzeLine(line);
            if (parsed.type === 'EMPTY') return;

            const el = document.createElement('div');

            if (parsed.type === 'TITLE') {
                el.className = 'doc-title';
                el.innerText = parsed.text;
            } else if (parsed.type === 'HEADING') {
                el.className = 'doc-heading';
                el.innerText = parsed.text;
            } else if (parsed.type === 'CLOSING') {
                el.className = 'doc-closing';
                el.innerText = parsed.text;
            } else if (parsed.type === 'TERM') {
                el.className = 'doc-term';
                el.innerHTML = `<span class="doc-term-bold">${parsed.term}</span> ${parsed.desc}`;
            } else {
                el.className = 'doc-paragraph';
                el.innerText = parsed.text;
            }

            container.appendChild(el);
        });
    }

    // تصدير Word محلي 100% بدون أي سيرفر أو اتصال بالنت
    function exportWord() {
        const content = document.getElementById('docContent').innerHTML;
        const font = document.getElementById('fontSelect').value.split(',')[0].replace(/'/g, '');

        const htmlDocument = `
            <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
            <head>
                <meta charset='utf-8'>
                <style>
                    body { font-family: '${font}', 'Traditional Arabic', serif; direction: rtl; text-align: right; }
                    .doc-title { text-align: center; font-size: 18pt; font-weight: bold; margin-bottom: 20px; text-decoration: underline; }
                    .doc-heading { font-size: 14pt; font-weight: bold; margin-top: 15px; text-decoration: underline; }
                    .doc-paragraph { font-size: 12.5pt; line-height: 1.5; text-align: justify; text-indent: 1cm; margin-bottom: 6px; }
                    .doc-term { font-size: 12.5pt; margin-bottom: 6px; }
                    .doc-term-bold { font-weight: bold; }
                    .doc-closing { text-align: left; font-weight: bold; font-size: 13pt; margin-top: 25px; }
                </style>
            </head>
            <body>
                ${content}
            </body>
            </html>
        `;

        const blob = new Blob(['\ufeff' + htmlDocument], { type: 'application/msword' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = 'مستند_مُنظم.doc';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    function exportPDF() {
        window.print();
    }

    // تحميل نموذج افتراضي عند الفتح
    loadTemplate('complaint');
</script>

</body>
</html>
