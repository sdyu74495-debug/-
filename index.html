    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@400;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        /* أنماط الخطوط الأكاديمية والكلاسيكية */
        .font-amiri { font-family: 'Amiri', 'Traditional Arabic', serif; }
        .font-cairo { font-family: 'Cairo', sans-serif; }
        .font-tajawal { font-family: 'Tajawal', sans-serif; }
        .font-traditional { font-family: 'Traditional Arabic', 'Amiri', serif; }

        /* محاكاة ورقة A4 حقيقية للمعاينة بالأبيض والأسود */
        .a4-page {
            width: 210mm;
            min-height: 297mm;
            background: #ffffff;
            color: #000000;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            box-sizing: border-box;
            position: relative;
            word-wrap: break-word;
            overflow-wrap: break-word;
            margin: 0 auto;
            transition: all 0.2s ease-in-out;
        }

        /* تخصيص الطباعة لمنع التكرار أو الصفحات الفارغة الزائدة */
        @media print {
            body {
                background: #ffffff !important;
                color: #000000 !important;
            }
            .no-print {
                display: none !important;
            }
            #print-area {
                position: absolute;
                left: 0;
                top: 0;
                width: 100% !important;
                margin: 0 !important;
                box-shadow: none !important;
                border: none !important;
            }
            @page {
                size: A4 portrait;
                margin: 15mm 15mm 15mm 15mm;
            }
        }

        /* إطار صفحة كلاسيكي اسود وبسيط */
        .page-border-classic {
            border: 2px solid #000000;
            outline: 1px solid #000000;
            outline-offset: -6px;
        }

        /* شريط التمرير مخصص لصفحة المعاينة */
        .preview-container::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        .preview-container::-webkit-scrollbar-thumb {
            background: #3f3f46;
            border-radius: 4px;
        }
        .preview-container::-webkit-scrollbar-track {
            background: #18181b;
        }
    </style>
</head>

    <!-- الكود البرمجي لمُحرّك التحليل والتنسيق والتصدير -->
    <script>
        // ==========================================
        // 1. المُحرّك الشامل للتكيف والتحليل (Universal Text Parser)
        // ==========================================
        function parseTextToElements(rawText) {
            const lines = rawText.split(/\r?\n/);
            const elements = [];
            let isFirstNonEmpty = true;

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();

                // 1. التعامل مع الأسطر الفارغة
                if (!line) {
                    elements.push({ type: 'EMPTY' });
                    continue;
                }

                // 2. العنوان الرئيسي (Main Title)
                const titleKeywords = /^(مذكرة|صحيفة|عقد|خطاب|تقرير|بيان|طلب|بحث|مشروع|جدول أعمال|محضر|دليل|عرض|لائحة|إعلان|دليل المصطلحات|التعاريف|شكوى|استقالة|توصية)/i;
                const isShortTitle = line.length < 60 && !line.endsWith('.') && !line.endsWith(':');

                if (isFirstNonEmpty && (titleKeywords.test(line) || isShortTitle)) {
                    elements.push({ type: 'MAIN_TITLE', text: line });
                    isFirstNonEmpty = false;
                    continue;
                }
                isFirstNonEmpty = false;

                // 3. التوقيعات والختام (Closing & Signatures)
                const closingKeywords = /^(توقيع|مقدمه|مقدم الطلب|مقدم الشكوى|الطالب|وكيل|شاكرين|وتفضلوا|تحريراً في|حرر في|والله ولي التوفيق|المحامي|المرسل|رئيس اللجنة|اعتماد|أمين السر|حرر بواسطة)/i;
                if (closingKeywords.test(line) || line.includes("والله ولي التوفيق") || line.includes("وتقبلوا بقبول") || line.includes("مع فائق الاحترام")) {
                    elements.push({ type: 'CLOSING', text: line });
                    continue;
                }

                // 4. فحص صيغة المصطلح والتعريف (Key: Value)
                const termPattern = /^([^:\n]{2,45}):\s*(.+)$/;
                const termMatch = line.match(termPattern);
                const headingWords = /^(أولاً|ثانياً|ثالثاً|رابعاً|خامساً|سادساً|سابعاً|ثامناً|تاسعاً|عاشراً|الموضوع|الوقائع|الأسباب|الطلبات|التوصيات|النتائج|الحضور|جدول الأعمال|موضوع الشكوى|المرفوع إلى|مقدمة من|ضد)/i;

                if (termMatch && !headingWords.test(termMatch[1].trim())) {
                    elements.push({ 
                        type: 'TERM_DEF', 
                        term: termMatch[1].trim(), 
                        def: termMatch[2].trim() 
                    });
                    continue;
                }

                // 5. العناوين الفرعية والتقسيمات (Section Headings)
                const numberedHeading = /^(\d+|[أ-ي])[\.-]\s+/;
                if (headingWords.test(line) || line.endsWith(':') || (numberedHeading.test(line) && line.length < 65 && !line.endsWith('.'))) {
                    elements.push({ type: 'HEADING', text: line });
                    continue;
                }

                // 6. القوائم والتعداد (List Items)
                const listBulletPattern = /^([-*•◦▪]|(\d+|[أ-ي])[\)-])\s+/;
                if (listBulletPattern.test(line)) {
                    elements.push({ type: 'LIST_ITEM', text: line });
                    continue;
                }

                // 7. الفقرات العامة العادية
                elements.push({ type: 'PARAGRAPH', text: line });
            }

            return elements;
        }

        // ==========================================
        // 2. تحديث التنسيق والمعاينة الحية (A4 Black & White)
        // ==========================================
        function updateFormatting() {
            const rawText = document.getElementById('raw-text').value;
            const customHeader = document.getElementById('custom-header-input').value.trim();
            const container = document.getElementById('formatted-content');
            const pageBorder = document.getElementById('page-border').checked;
            const a4Page = document.getElementById('print-area');

            // إعدادات التحكم
            const fontFamilyClass = document.getElementById('font-family').value;
            const fontSize = document.getElementById('font-size').value;
            const lineHeight = document.getElementById('line-height').value;
            const margins = document.getElementById('page-margins').value;
            const centerMainTitle = document.getElementById('center-main-title').checked;
            const underlineHeadings = document.getElementById('underline-headings').checked;
            const firstLineIndent = document.getElementById('first-line-indent').checked;
            const boldTerms = document.getElementById('bold-terms').checked;
            const autoDate = document.getElementById('auto-date').checked;

            // تطبيق نوع الخط والهوامش على صفحة A4
            a4Page.className = `a4-page ${fontFamilyClass} ${pageBorder ? 'page-border-classic' : ''} transition-all`;
            a4Page.style.fontSize = fontSize;
            a4Page.style.lineHeight = lineHeight;
            a4Page.style.padding = margins;

            // تحليل النص
            const elements = parseTextToElements(rawText);
            
            // تحديث الإحصائيات
            const wordCount = rawText.trim() ? rawText.trim().split(/\s+/).length : 0;
            const nonEmptyElements = elements.filter(e => e.type !== 'EMPTY').length;
            document.getElementById('stat-words').innerText = `الكلمات: ${wordCount}`;
            document.getElementById('stat-paragraphs').innerText = `العناصر والفقرات: ${nonEmptyElements}`;

            if (!rawText.trim() && !customHeader) {
                container.innerHTML = `
                    <div class="h-96 flex flex-col items-center justify-center text-zinc-400 border-2 border-dashed border-zinc-300 rounded-lg p-6 text-center">
                        <svg class="w-12 h-12 mb-2 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                        <p class="font-bold text-sm text-zinc-700">المعاينة الحية جاهزة</p>
                        <p class="text-xs text-zinc-500 mt-1">اكتب أي نص أو اختر نموذجاً تجريبياً من اللوحة الجانبية.</p>
                    </div>
                `;
                return;
            }

            let htmlOutput = '';

            // الترويسة المخصصة إن وجدت
            if (customHeader) {
                htmlOutput += `
                    <div class="text-center font-bold text-xs md:text-sm border-b border-black pb-2 mb-4 tracking-wide text-black">
                        ${escapeHtml(customHeader)}
                    </div>
                `;
            }

            elements.forEach(item => {
                if (item.type === 'EMPTY') {
                    htmlOutput += `<div style="height: 10px;"></div>`;
                } else if (item.type === 'MAIN_TITLE') {
                    const alignClass = centerMainTitle ? 'text-center' : 'text-right';
                    htmlOutput += `
                        <h1 class="${alignClass} font-bold text-xl md:text-2xl mb-4 pb-1 border-b-2 border-black tracking-wide text-black" style="margin-top: 5px;">
                            ${escapeHtml(item.text)}
                        </h1>
                    `;
                } else if (item.type === 'HEADING') {
                    const underlineStyle = underlineHeadings ? 'text-decoration: underline; text-underline-offset: 3px;' : '';
                    htmlOutput += `
                        <h2 class="font-bold text-base md:text-lg text-black mt-3 mb-1.5" style="${underlineStyle} page-break-after: avoid;">
                            ${escapeHtml(item.text)}
                        </h2>
                    `;
                } else if (item.type === 'TERM_DEF') {
                    const termFontWeight = boldTerms ? 'font-bold' : 'font-semibold';
                    htmlOutput += `
                        <div class="mb-2 text-justify text-black">
                            <strong class="${termFontWeight}">${escapeHtml(item.term)}:</strong>
                            <span>${escapeHtml(item.def)}</span>
                        </div>
                    `;
                } else if (item.type === 'LIST_ITEM') {
                    htmlOutput += `
                        <div class="flex items-start space-x-2 space-x-reverse my-1 pr-2 text-black">
                            <span class="font-bold">•</span>
                            <span class="flex-1 text-justify">${escapeHtml(item.text.replace(/^([-*•◦▪]|(\d+|[أ-ي])[\)-])\s+/, ''))}</span>
                        </div>
                    `;
                } else if (item.type === 'CLOSING') {
                    htmlOutput += `
                        <div class="text-left font-bold text-sm md:text-base mt-5 mb-2 pl-2 text-black" style="page-break-inside: avoid;">
                            ${escapeHtml(item.text)}
                        </div>
                    `;
                } else { // PARAGRAPH
                    const indentStyle = firstLineIndent ? 'text-indent: 1cm;' : '';
                    htmlOutput += `
                        <p class="text-justify leading-relaxed mb-2 text-black" style="${indentStyle}">
                            ${escapeHtml(item.text)}
                        </p>
                    `;
                }
            });

            // إضافة تاريخ اليوم بأسفل المستند إذا تُم تفعيله
            if (autoDate) {
                const today = new Date().toLocaleDateString('ar-EG', { year: 'numeric', month: 'long', day: 'numeric' });
                htmlOutput += `
                    <div class="text-right text-xs md:text-sm font-semibold mt-6 pt-3 border-t border-black text-black" style="page-break-inside: avoid;">
                        التاريخ: ${today}
                    </div>
                `;
            }

            container.innerHTML = htmlOutput;
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        // ==========================================
        // 3. النماذج التجريبية السريعة
        // ==========================================
        const samples = {
            student: `مذكرة شكوى أكاديمية وإدارية\n\nالمرفوع إلى: أ.د. عميد الكلية المحترم\nمقدمة من الطالب: أحمد محمود (السنة الثالثة - قسم الحاسبات)\nضــد الطالب: كريم خالد (السنة الثالثة - قسم الحاسبات)\n\nموضوع الشكوى:\nالتعدي على حقوق المشروع الجماعي وتكرار الإساءة السلوكية.\n\nأولاً: الوقائع\n1. بتاريخ 20 أكتوبر 2026، قام المشكو في حقه بالاستيلاء على الجزء البرمجي الخاص بي في مشروع التخرج ونسبه لنفسه.\n2. عند محاولة نقاش الأمر معه هادئاً، قام بالتلفظ بعبارات غير لائقة أمام زملائنا بالدفعة.\n\nثانياً: الأسباب والمطالب\n- بناءً على لائحة الانضباط الطلابي بالجامعة، المادة 12 الخاصة بانتهاك الأمانة الأكاديمية.\n- السلوك الصادر يتنافى مع القواعد الإدارية والجامعية المرعية.\n\nثالثاً: الطلبات\nنلتمس من سيادتكم التكرم بـ:\n- إحالة الشكوى إلى لجنة الانضباط الطلابي.\n- التحقق من ملفات المشروع وإعادة التقييم الأكاديمي المستحق.\n\nوتقبلوا بقبول فائق الاحترام والتقدير\nمقدمه الطالب: أحمد محمود`,

            terms: `دليل المصطلحات والتعريفات التقنية والأكاديمية\n\nالذكاء الاصطناعي: قدرة الأنظمة الحاسوبية على محاكاة القدرات الذهنية البشرية وأنماط التعلم الذاتي.\nواجهة برمجة التطبيقات: جسر برمجي يتيح للتطبيقات المختلفة التواصل وتبادل البيانات بنظام وآمان.\nمعالجة اللغات الطبيعية: فرع تقني يُمكّن الحاسوب من فهم واستخلاص المعاني من النصوص البشرية.\nالأتمتة التلقائية: تنفيذ العمليات والمهام التكرارية دون الحاجة إلى تدخل بشري مباشر.\nالتشفير النهائي: تقنية أمنية تضمن عدم قراءة الرسائل إلا من قبل الطرفين المباشرين للمحادثة.\n\nحرر بواسطة: وحدة تطوير البحوث`,

            legal: `مذكرة دفاع ورأي قانوني\n\nمقدمة من: مكتب الاستشارات القانونية\nبشأن: تفنيد ادعاءات المسؤولية العقدية في الدعوى رقم 892\n\nأولاً: التكييف القانوني للواقعة\nإن النزاع الماثل لا ينطوي على خطأ عقدي، وإنما يندرج تحت نص المادة 215 من القانون المدني المتعلقة بالقوة القاهرة والظروف الطارئة.\n\nثانياً: الأسانيد\n- عدم توافر رابطة السببية بين الفعل والضرر المدعى به.\n- تنفيذ الموكل لـ 80% من بنود الاتفاق قبل وقوع الجائحة الإدارية.\n\nثالثاً: النتيجة والطلب\nإلغاء المطالبة بالتعويض وإلزام المدعي بالمصروفات.\n\nوالله ولي التوفيق\nمستشار القانون: محمد العتيبي`,

            meeting: `محضر اجتماع لجنة إدارة المشروعات\n\nالحضور:\n- رئيس اللجنة: د. خالد عبد الرحمن\n- أمين السر: م. سارة أحمد\n- الأعضاء: م. عادل الشريف، د. هدى محمود\n\nجدول الأعمال:\n1. استعراض نسبة الإنجاز في الربع الثالث.\n2. مناقشة التحديات والحلول المقترحة.\n\nالتوصيات والقرارات:\n- التوصية الأولى: تمديد الموعد النهائي لتسليم المرحلة الثانية مدة أسبوعين.\n- التوصية الثانية: تخصيص ميزانية إضافية للدعم الفني والتدريب.\n- التوصية الثالثة: عقد اجتماع متابعة أسبوعي كل يوم اثنين.\n\nتوقيع أمين السر: م. سارة أحمد\nاعتماد رئيس اللجنة: د. خالد عبد الرحمن`
        };

        function loadSample(type) {
            document.getElementById('raw-text').value = samples[type];
            updateFormatting();
            showToast("تم تحميل النموذج التجريبي ✨");
        }

        // ==========================================
        // 4. مسح ونسخ النصوص
        // ==========================================
        function promptClearText() {
            document.getElementById('confirm-modal').classList.remove('hidden');
        }

        function closeClearModal() {
            document.getElementById('confirm-modal').classList.add('hidden');
        }

        function confirmClearText() {
            document.getElementById('raw-text').value = '';
            document.getElementById('custom-header-input').value = '';
            closeClearModal();
            updateFormatting();
            showToast("تم مسح المحتوى بالكامل");
        }

        function copyFormattedText() {
            const rawText = document.getElementById('raw-text').value;
            if (!rawText.trim()) {
                showToast("⚠️ لا يوجد نص لنسخه!");
                return;
            }

            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(rawText).then(() => {
                    showToast("📋 تم نسخ النص للحافظة بنجاح!");
                }).catch(() => fallbackCopy(rawText));
            } else {
                fallbackCopy(rawText);
            }
        }

        function fallbackCopy(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.opacity = "0";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
                showToast("📋 تم نسخ النص للحافظة!");
            } catch (err) {
                showToast("❌ تعذر النسخ التلقائي");
            }
            document.body.removeChild(textArea);
        }

        // ==========================================
        // 5. التصدير المباشر كـ Word (.doc) أوفلاين 100%
        // ==========================================
        function exportToWord() {
            const rawText = document.getElementById('raw-text').value;
            const customHeader = document.getElementById('custom-header-input').value;
            if (!rawText.trim() && !customHeader.trim()) {
                showToast("⚠️ يرجى كتابة نص قبل التصدير!");
                return;
            }

            let fileNameInput = document.getElementById('export-filename').value.trim();
            if (!fileNameInput) fileNameInput = "مستند_رسمي_مُنظم";
            if (!fileNameInput.endsWith('.doc')) fileNameInput += '.doc';

            const contentHTML = document.getElementById('formatted-content').innerHTML;
            const fontSelect = document.getElementById('font-family');
            const fontName = fontSelect.options[fontSelect.selectedIndex].text.split(' ')[0];

            // تحضير مستند Word بأعلى دقة وتنسيق عربي محلي
            const wordDocumentHTML = `
                <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
                <head>
                    <meta charset='utf-8'>
                    <style>
                        body {
                            font-family: '${fontName}', 'Traditional Arabic', 'Amiri', serif;
                            direction: rtl;
                            text-align: right;
                            color: #000000;
                            line-height: 1.5;
                            font-size: 14pt;
                        }
                        h1 { text-align: center; font-size: 18pt; font-weight: bold; margin-bottom: 18px; text-decoration: underline; }
                        h2 { font-size: 15pt; font-weight: bold; margin-top: 14px; margin-bottom: 6px; text-decoration: underline; }
                        p { font-size: 13pt; text-align: justify; text-indent: 1cm; margin-bottom: 8px; }
                        div { font-size: 13pt; margin-bottom: 6px; }
                        strong { font-weight: bold; }
                    </style>
                </head>
                <body>
                    ${contentHTML}
                </body>
                </html>
            `;

            // استخدام Blob أوفلاين بدون أي اتصال بالشبكة
            const blob = new Blob(['\ufeff' + wordDocumentHTML], { type: 'application/msword;charset=utf-8' });
            const downloadUrl = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = downloadUrl;
            a.download = fileNameInput;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(downloadUrl);

            showToast("📄 تم تصدير ملف Word بنجاح!");
        }

        function printDocument() {
            const rawText = document.getElementById('raw-text').value;
            if (!rawText.trim()) {
                showToast("⚠️ يرجى كتابة نص أولاً قبل الطباعة!");
                return;
            }
            window.print();
        }

        // ==========================================
        // 6. التبديل بين اللوحات في الهواتف الذكية
        // ==========================================
        function switchMobileTab(tab) {
            const editorPanel = document.getElementById('editor-panel');
            const previewPanel = document.getElementById('preview-panel');
            const editorBtn = document.getElementById('tab-editor-btn');
            const previewBtn = document.getElementById('tab-preview-btn');

            if (tab === 'editor') {
                editorPanel.classList.remove('hidden');
                previewPanel.classList.add('hidden');
                editorBtn.className = 'flex-1 py-2 text-center text-xs font-bold rounded bg-zinc-800 text-white';
                previewBtn.className = 'flex-1 py-2 text-center text-xs font-bold rounded text-zinc-400';
            } else {
                editorPanel.classList.add('hidden');
                previewPanel.classList.remove('hidden');
                previewPanel.classList.add('flex');
                previewBtn.className = 'flex-1 py-2 text-center text-xs font-bold rounded bg-zinc-800 text-white';
                editorBtn.className = 'flex-1 py-2 text-center text-xs font-bold rounded text-zinc-400';
            }
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').innerText = message;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2500);
        }

        window.onload = function() {
            // تحميل النموذج الجامعي افتراضياً
            loadSample('student');
        };
    </script>
</body>
