<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المحرر الذكي للمستندات</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Cairo', sans-serif; background-color: #f4f5f7; color: #000; direction: rtl; }

        .app-container { display: flex; flex-direction: column; min-height: 100vh; padding: 12px; max-width: 1300px; margin: 0 auto; gap: 12px; }
        
        header { background: #111; color: #fff; padding: 14px; border-radius: 8px; text-align: center; }
        header h1 { font-size: 1.25rem; margin-bottom: 2px; }
        header p { font-size: 0.8rem; color: #bbb; }

        .main-content { display: flex; flex-direction: column; gap: 12px; }
        @media (min-width: 992px) {
            .main-content { display: grid; grid-template-columns: 440px 1fr; align-items: start; }
        }

        .panel { background: #fff; padding: 14px; border-radius: 8px; border: 1px solid #ddd; }
        .section-title { font-size: 0.95rem; font-weight: 700; margin-bottom: 8px; border-bottom: 2px solid #000; padding-bottom: 4px; }

        .templates-container { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
        .btn-template { background: #f0f0f0; color: #000; border: 1px solid #bbb; padding: 5px 8px; border-radius: 4px; cursor: pointer; font-size: 0.78rem; font-family: inherit; font-weight: 600; }
        .btn-template:hover { background: #000; color: #fff; }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
        .form-group { margin-bottom: 8px; }
        .form-group.full { grid-column: span 2; }
        label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 3px; }
        select, input[type="text"], textarea { width: 100%; padding: 7px; border: 1px solid #ccc; border-radius: 4px; font-family: inherit; font-size: 0.85rem; }
        textarea { height: 180px; resize: vertical; line-height: 1.5; }

        .stats-bar { font-size: 0.75rem; color: #555; margin-bottom: 8px; text-align: left; }

        .actions-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 6px; }
        .btn { padding: 9px; border: none; border-radius: 4px; cursor: pointer; font-weight: 700; font-size: 0.85rem; font-family: inherit; text-align: center; }
        .btn-word { background: #000; color: #fff; }
        .btn-pdf { background: #333; color: #fff; }
        .btn-secondary { background: #eee; color: #000; border: 1px solid #ccc; }
        .btn-danger { background: #fff; color: #a00; border: 1px solid #a00; }

        /* معاينة المستند */
        .preview-wrapper { background: #555; padding: 10px; border-radius: 8px; overflow-x: auto; display: flex; justify-content: center; }
        .paper { background: #fff; color: #000; width: 100%; max-width: 210mm; min-height: 297mm; padding: 20mm 18mm; border: 1px solid #888; box-sizing: border-box; transition: all 0.2s; }

        /* عناصر النص داخل المعاينة */
        .doc-header-text { text-align: center; font-size: 10pt; font-weight: bold; border-bottom: 1px solid #000; padding-bottom: 4px; margin-bottom: 12px; }
        .doc-title { text-align: center; font-weight: bold; margin-bottom: 16px; border-bottom: 2px solid #000; padding-bottom: 6px; }
        .doc-heading { font-weight: bold; margin-top: 12px; margin-bottom: 4px; text-decoration: underline; page-break-after: avoid; }
        .doc-paragraph { text-align: justify; text-justify: inter-word; margin-bottom: 6px; }
        .doc-term { margin-bottom: 6px; text-align: justify; }
        .doc-term-bold { font-weight: bold; }
        .doc-date { text-align: right; font-weight: bold; font-size: 10pt; margin-top: 15px; }
        .doc-closing { text-align: left; font-weight: bold; margin-top: 20px; page-break-inside: avoid; }

        /* الطباعة */
        @media print {
            body { background: #fff; }
            .app-container, .main-content { display: block; padding: 0; margin: 0; }
            header, .panel { display: none !important; }
            .preview-wrapper { background: #fff; padding: 0; border-radius: 0; }
            .paper { border: none; width: 100%; max-width: none; min-height: auto; padding: 0 !important; margin: 0; box-shadow: none; }
            @page { size: A4; margin: 2cm 1.5cm; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>⚖️ المحرر والمنظم الذكي للمستندات</h1>
        <p>تنسيق فوري محترف أحادي اللون متوافق 100% مع الطباعة وتطبيقات الموبايل</p>
    </header>

    <div class="main-content">
        <!-- لوحة الإعدادات -->
        <div class="panel">
            <div class="section-title">⚡ نماذج تجريبية سريعة</div>
            <div class="templates-container">
                <button class="btn-template" onclick="loadTemplate('complaint')">📝 شكوى ضد زميل</button>
                <button class="btn-template" onclick="loadTemplate('defense')">⚖️ مذكرة دفاع</button>
                <button class="btn-template" onclick="loadTemplate('terms')">📚 مصطلحات وتعاريف</button>
                <button class="btn-template" onclick="loadTemplate('minutes')">📑 محضر اجتماع</button>
            </div>

            <div class="form-grid">
                <div class="form-group full">
                    <label for="fileName">اسم الملف عند التصدير:</label>
                    <input type="text" id="fileName" value="مستند_مُنظم" placeholder="اكتب اسم الملف...">
                </div>

                <div class="form-group">
                    <label for="fontSelect">نوع الخط:</label>
                    <select id="fontSelect" onchange="updatePreview()">
                        <option value="'Amiri', serif">Amiri (أميـري)</option>
                        <option value="'Tajawal', sans-serif">Tajawal (تجول)</option>
                        <option value="'Cairo', sans-serif">Cairo (القاهرة)</option>
                        <option value="'Traditional Arabic', serif">Traditional Arabic</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="fontSize">حجم الخط:</label>
                    <select id="fontSize" onchange="updatePreview()">
                        <option value="12pt">12pt (قياسي)</option>
                        <option value="13pt" selected>13pt (مناسب)</option>
                        <option value="14pt">14pt (كبير)</option>
                        <option value="16pt">16pt (عنوان)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="lineHeight">تباعد الأسطر:</label>
                    <select id="lineHeight" onchange="updatePreview()">
                        <option value="1.2">مضغوط (1.2)</option>
                        <option value="1.4" selected>متوسط (1.4)</option>
                        <option value="1.6">مزدوج (1.6)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="marginSelect">هوامش الورقة:</label>
                    <select id="marginSelect" onchange="updatePreview()">
                        <option value="15mm 12mm">ضيقة (1.5 سم)</option>
                        <option value="20mm 18mm" selected>قياسية (2.0 سم)</option>
                        <option value="28mm 22mm">واسعة (2.8 سم)</option>
                    </select>
                </div>

                <div class="form-group full">
                    <label for="headerText">الترويسة العلوية (اختياري):</label>
                    <input type="text" id="headerText" oninput="updatePreview()" placeholder="مثال: جامعة القاهرة - كلية الحقوق">
                </div>
            </div>

            <div class="form-group">
                <label for="inputText">النص المراد تنسيقه:</label>
                <textarea id="inputText" oninput="updatePreview()" placeholder="اكتب النص هنا..."></textarea>
            </div>

            <div class="stats-bar" id="statsBar">عدد الكلمات: 0 | الفقرات: 0</div>

            <div class="form-group">
                <label><input type="checkbox" id="addDate" onchange="updatePreview()"> إضافة تاريخ اليوم أسفل المستند تلقائياً</label>
            </div>

            <div class="actions-grid">
                <button class="btn btn-word" onclick="exportWord()">📄 تصدير Word</button>
                <button class="btn btn-pdf" onclick="exportPDF()">🖨️ طباعة / PDF</button>
                <button class="btn btn-secondary" onclick="copyFormattedText()">📋 نسخ النص</button>
                <button class="btn btn-danger" onclick="clearText()">🗑️ مسح النص</button>
            </div>
        </div>

        <!-- المعاينة الحية -->
        <div class="preview-wrapper">
            <div id="paper" class="paper">
                <div id="docContent"></div>
            </div>
        </div>
    </div>
</div>

<script>
    const templates = {
        complaint: `مذكرة شكوى إدارية وأكاديمية\n\nالمرفوع إلى: أ.د. عميد الكلية المحترم\nمقدمة من الطالب: أحمد محمود (السنة الثالثة)\nضد الطالب: كريم خالد (السنة الثالثة)\n\nموضوع الشكوى:\nالتعدي على حقوق المشروع الجماعي وتكرار الإساءة السلوكية.\n\nأولاً: الوقائع\n1. بتاريخ 20 أكتوبر 2026، قام المشكو في حقه بالاستيلاء على الجزء البرمجي الخاص بي ونسبه لنفسه.\n2. عند محاولة النقاش معه هادئاً، قام بالتلفظ بعبارات غير لائقة أمام زملائنا بالدفعة.\n\nثانياً: الأسباب والمطالب\n- بناءً على لائحة الانضباط الطلابي بالجامعة المادة 12 الخاصة بانتهاك الأمانة الأكاديمية.\n\nثالثاً: الطلبات\nنلتمس من سيادتكم التكرم بـ:\n- إحالة الشكوى إلى لجنة الانضباط الطلابي.\n- التحقق من ملفات المشروع وإعادة التقييم الأكاديمي المستحق.\n\nتقبلوا بقبول فائق الاحترام والتقدير\nمقدمه الطالب: أحمد محمود`,
        defense: `مذكرة دفاع في الدعوى رقم 102 لسنة 2026\n\nالمرفوع إلى: عدالة المحكمة الموقرة\nمقدمة من: وكيل المدعى عليه\n\nأولاً: الدفع بعدم قبول الدعوى\nتأسساً على نص المادة 18 من قانون الإجراءات، حيث لم يقم المدعي بتقديم السند القانوني الضامن لطلبه.\n\nثانياً: عن الموضوع\nإن الوقائع الواردة بصحيفة الدعوى جاءت مرسلة ولا تسانده أي قرينة قانونية صحيحة.\n\nثالثاً: الطلبات\nنلتمس من المحكمة الموقرة:\n- رفض الدعوى وإلزام المدعي المصاريف.\n\nوكيل المدعى عليه: المحامي`,
        terms: `قائمة المصطلحات والتعاريف الأكاديمية\n\nالتحكيم التجاري: وسيلة بديلة لفض المنازعات بين الأطراف بواسطة محكمين يتم اختيارهم للفصل في النزاع.\nالعقد الأدبي: الاتفاق الذي يرتب التزامات اخلاقية دون اللجوء للقضاء.\nالقوة القاهرة: حدث استثنائي عام لا يمكن التنبؤ به يجعل تنفيذ الالتزام مستحيلاً.\n\nإعداد الطالب: أحمد محمود`,
        minutes: `محضر اجتماع لجنة التنسيق الأكاديمي\n\nالموضوع: تنظيم سير المحاضرات وحل مشكلات المنصة\n\nأولاً: الحضور\n- ممثل الدفعة وأعضاء اللجنة الموقرين.\n\nثانياً: القرارات والتوصيات\n1. اعتماد جدول المحاضرات الجديد اعتباراً من الأسبوع القادم.\n2. حل المشكلات التقنية المتعلقة بالوصول للمواد الدراسية.\n\nرئيس الجلسة: أدمن الدفعة`
    };

    function loadTemplate(key) {
        document.getElementById('inputText').value = templates[key];
        updatePreview();
    }

    function analyzeLine(line) {
        const text = line.trim();
        if (!text) return { type: 'EMPTY' };

        const titles = ['مذكرة', 'صحيفة', 'عقد', 'شكوى', 'محضر', 'قائمة', 'تقرير', 'بيان'];
        const headings = ['أولاً', 'ثانياً', 'ثالثاً', 'رابعاً', 'خامساً', 'الوقائع', 'الأسباب', 'الطلبات', 'الموضوع', 'الحضور', 'القرارات'];
        const closings = ['مقدمه', 'وكيل', 'المحامي', 'رئيس الجلسة', 'تقبلوا', 'والله ولي التوفيق'];

        if (titles.some(t => text.startsWith(t)) && text.length < 50) return { type: 'TITLE', text };
        if (headings.some(h => text.startsWith(h)) || text.endsWith(':')) return { type: 'HEADING', text };
        if (closings.some(c => text.startsWith(c))) return { type: 'CLOSING', text };
        
        if (text.includes(':') && !text.endsWith(':') && text.indexOf(':') < 35) {
            const parts = text.split(':');
            return { type: 'TERM', term: parts[0] + ':', desc: parts.slice(1).join(':') };
        }

        return { type: 'PARAGRAPH', text };
    }

    function updatePreview() {
        const text = document.getElementById('inputText').value;
        const font = document.getElementById('fontSelect').value;
        const size = document.getElementById('fontSize').value;
        const lh = document.getElementById('lineHeight').value;
        const margin = document.getElementById('marginSelect').value;
        const header = document.getElementById('headerText').value;
        const addDate = document.getElementById('addDate').checked;

        const container = document.getElementById('docContent');
        const paper = document.getElementById('paper');

        paper.style.fontFamily = font;
        paper.style.padding = margin;
        container.innerHTML = '';

        // الترويسة
        if (header.trim()) {
            const hDiv = document.createElement('div');
            hDiv.className = 'doc-header-text';
            hDiv.innerText = header.trim();
            container.appendChild(hDiv);
        }

        if (!text.trim()) {
            container.innerHTML += '<p style="text-align:center; color:#888; margin-top:50px;">سيظهر التنسيق المباشر للمستند هنا...</p>';
            updateStats(0, 0);
            return;
        }

        const lines = text.split('\n');
        let wordCount = 0;
        let pCount = 0;

        lines.forEach(line => {
            const parsed = analyzeLine(line);
            if (parsed.type === 'EMPTY') return;

            pCount++;
            wordCount += line.trim().split(/\s+/).length;

            const el = document.createElement('div');
            el.style.fontSize = size;
            el.style.lineHeight = lh;

            if (parsed.type === 'TITLE') {
                el.className = 'doc-title';
                el.style.fontSize = `calc(${size} + 4pt)`;
                el.innerText = parsed.text;
            } else if (parsed.type === 'HEADING') {
                el.className = 'doc-heading';
                el.style.fontSize = `calc(${size} + 1pt)`;
                el.innerText = parsed.text;
            } else if (parsed.type === 'CLOSING') {
                el.className = 'doc-closing';
                el.innerText = parsed.text;
            } else if (parsed.type === 'TERM') {
                el.className = 'doc-term';
                el.innerHTML = `<span class="doc-term-bold">${parsed.term}</span> ${parsed.desc}`;
            } else {
                el.className = 'doc-paragraph';
                el.style.textIndent = '0.8cm';
                el.innerText = parsed.text;
            }

            container.appendChild(el);
        });

        if (addDate) {
            const dateDiv = document.createElement('div');
            dateDiv.className = 'doc-date';
            const today = new Date().toLocaleDateString('ar-EG', { year: 'numeric', month: 'long', day: 'numeric' });
            dateDiv.innerText = 'التاريخ: ' + today;
            container.appendChild(dateDiv);
        }

        updateStats(wordCount, pCount);
    }

    function updateStats(words, paragraphs) {
        document.getElementById('statsBar').innerText = `عدد الكلمات: ${words} | الفقرات: ${paragraphs}`;
    }

    // تصدير Word متوافق 100% مع الموبايل بفرز التنسيقات الضمنية ووسوم المايكروسوفت
    function exportWord() {
        const text = document.getElementById('inputText').value;
        if (!text.trim()) {
            alert('يرجى إدخال نص أولاً قبل التصدير.');
            return;
        }

        const font = document.getElementById('fontSelect').value.split(',')[0].replace(/'/g, '');
        const size = document.getElementById('fontSize').value;
        const lh = document.getElementById('lineHeight').value;
        const headerText = document.getElementById('headerText').value;
        const addDate = document.getElementById('addDate').checked;
        const rawFileName = document.getElementById('fileName').value.trim() || 'مستند_مُنظم';

        let bodyHtml = '';

        if (headerText.trim()) {
            bodyHtml += `<p style="text-align:center; font-weight:bold; font-size:10pt; border-bottom:1px solid #000; padding-bottom:4px; margin-bottom:15pt; mso-line-height-rule:exactly;">${headerText.trim()}</p>`;
        }

        const lines = text.split('\n');
        lines.forEach(line => {
            const parsed = analyzeLine(line);
            if (parsed.type === 'EMPTY') return;

            if (parsed.type === 'TITLE') {
                bodyHtml += `<p style="text-align:center; font-size:16pt; font-weight:bold; margin-top:10pt; margin-bottom:15pt; text-decoration:underline; mso-line-height-rule:exactly;">${parsed.text}</p>`;
            } else if (parsed.type === 'HEADING') {
                bodyHtml += `<p style="text-align:right; font-size:13pt; font-weight:bold; margin-top:12pt; margin-bottom:4pt; text-decoration:underline; mso-line-height-rule:exactly;">${parsed.text}</p>`;
            } else if (parsed.type === 'CLOSING') {
                bodyHtml += `<p style="text-align:left; font-size:${size}; font-weight:bold; margin-top:20pt; margin-bottom:5pt; mso-line-height-rule:exactly;">${parsed.text}</p>`;
            } else if (parsed.type === 'TERM') {
                bodyHtml += `<p style="text-align:justify; font-size:${size}; line-height:${lh}; margin-bottom:5pt; mso-line-height-rule:exactly;"><b style="font-weight:bold;">${parsed.term}</b> ${parsed.desc}</p>`;
            } else {
                bodyHtml += `<p style="text-align:justify; font-size:${size}; line-height:${lh}; text-indent:24pt; margin-bottom:5pt; mso-line-height-rule:exactly;">${parsed.text}</p>`;
            }
        });

        if (addDate) {
            const today = new Date().toLocaleDateString('ar-EG', { year: 'numeric', month: 'long', day: 'numeric' });
            bodyHtml += `<p style="text-align:right; font-weight:bold; font-size:10pt; margin-top:15pt;">التاريخ: ${today}</p>`;
        }

        const fullDocument = `
            <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40' dir='rtl'>
            <head>
                <meta charset='utf-8'>
                <!--[if gte mso 9]>
                <xml>
                <w:WordDocument>
                    <w:View>Print</w:View>
                    <w:Zoom>100</w:Zoom>
                    <w:DoNotOptimizeForTemplate/>
                </w:WordDocument>
                </xml>
                <![endif]-->
                <style>
                    @page { size: A4; margin: 2.0cm 1.8cm; }
                    body { font-family: '${font}', 'Traditional Arabic', Arial, serif; direction: rtl; text-align: right; font-size: ${size}; }
                    p { margin: 0; padding: 0; }
                </style>
            </head>
            <body dir='rtl' style='direction:rtl; text-align:right;'>
                ${bodyHtml}
            </body>
            </html>
        `;

        const blob = new Blob(['\ufeff' + fullDocument], { type: 'application/msword' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `${rawFileName}.doc`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    function exportPDF() {
        window.print();
    }

    function copyFormattedText() {
        const text = document.getElementById('inputText').value;
        if (!text.trim()) return;
        navigator.clipboard.writeText(text).then(() => {
            alert('تم نسخ النص الحافظة بنجاح!');
        });
    }

    function clearText() {
        if (document.getElementById('inputText').value.trim() === '') return;
        if (confirm('هل أنت تأكد من مسح النص الحالي بالكامل؟')) {
            document.getElementById('inputText').value = '';
            updatePreview();
        }
    }

    // تحميل نموذج عند أول تشغيل
    loadTemplate('complaint');
</script>

</body>
</html>
