    <!-- الكود البرمجي لمُحرّك التحليل الذكي والتصدير -->
    <script>
        // ==========================================
        // 1. المُحرّك الشامل للتكيف والتحليل (Universal Text Parser)
        // ==========================================
        function parseTextToElements(rawText) {
            const lines = rawText.split(/\r?\n/);
            const elements = [];
            let isFirstNonEmpty = true;

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();

                // 1. التعامل مع الأسطر الفارغة
                if (!line) {
                    elements.push({ type: 'EMPTY' });
                    continue;
                }

                // 2. العنوان الرئيسي (Main Title)
                const titleKeywords = /^(مذكرة|صحيفة|عقد|خطاب|تقرير|بيان|طلب|بحث|مشروع|جدول أعمال|محضر|دليل|عرض|لائحة|إعلان|دليل المصطلحات|التعاريف|شكوى|استقالة|توصية)/i;
                const isShortTitle = line.length < 55 && !line.endsWith('.') && !line.endsWith(':');

                if (isFirstNonEmpty && (titleKeywords.test(line) || isShortTitle)) {
                    elements.push({ type: 'MAIN_TITLE', text: line });
                    isFirstNonEmpty = false;
                    continue;
                }
                isFirstNonEmpty = false;

                // 3. التوقيعات والختام (Closing & Signatures)
                const closingKeywords = /^(توقيع|مقدمه|مقدم الطلب|مقدم الشكوى|الطالب|وكيل|شاكرين|وتفضلوا|تحريراً في|حرر في|والله ولي التوفيق|المحامي|المرسل|رئيس اللجنة|اعتماد|أمين السر|حرر بواسطة)/i;
                if (closingKeywords.test(line) || line.includes("والله ولي التوفيق") || line.includes("وتقبلوا بقبول") || line.includes("مع فائق الاحترام")) {
                    elements.push({ type: 'CLOSING', text: line });
                    continue;
                }

                // 4. فحص صيغة المصطلح والتعريف (Key: Value or Term: Definition)
                // النمط: نص أقصر من 45 حرف يليه نقطتين ":" ثم شرح أو تعريف
                const termPattern = /^([^:\n]{2,45}):\s*(.+)$/;
                const termMatch = line.match(termPattern);
                
                // التأكد من أن المفتاح ليس إحدى العناوين القياسية مثل "أولاً:"
                const headingWords = /^(أولاً|ثانياً|ثالثاً|رابعاً|خامساً|سادساً|سابعاً|ثامناً|تاسعاً|عاشراً|الموضوع|الوقائع|الأسباب|الطلبات|التوصيات|النتائج|الحضور|جدول الأعمال|موضوع الشكوى|المرفوع إلى)/i;

                if (termMatch && !headingWords.test(termMatch[1].trim())) {
                    elements.push({ 
                        type: 'TERM_DEF', 
                        term: termMatch[1].trim(), 
                        def: termMatch[2].trim() 
                    });
                    continue;
                }

                // 5. العناوين الفرعية والتقسيمات (Section Headings)
                const numberedHeading = /^(\d+|[أ-ي])[\.-]\s+/;

                if (headingWords.test(line) || line.endsWith(':') || (numberedHeading.test(line) && line.length < 60 && !line.endsWith('.'))) {
                    elements.push({ type: 'HEADING', text: line });
                    continue;
                }

                // 6. القوائم والتعداد النقطي/الرقمي (List Items)
                const listBulletPattern = /^([-*•◦▪]|(\d+|[أ-ي])[\)-])\s+/;
                if (listBulletPattern.test(line)) {
                    elements.push({ type: 'LIST_ITEM', text: line });
                    continue;
                }

                // 7. الفقرات العامة العادية (Standard Paragraph)
                elements.push({ type: 'PARAGRAPH', text: line });
            }

            return elements;
        }

        // ==========================================
        // 2. تحديث التنسيق والمعاينة الحية (A4 Black & White)
        // ==========================================
        function updateFormatting() {
            const rawText = document.getElementById('raw-text').value;
            const container = document.getElementById('formatted-content');
            const pageBorder = document.getElementById('page-border').checked;
            const a4Page = document.getElementById('print-area');

            // إعدادات التحكم
            const fontFamilyClass = document.getElementById('font-family').value;
            const fontSize = document.getElementById('font-size').value;
            const lineHeight = document.getElementById('line-height').value;
            const paragraphGap = document.getElementById('paragraph-gap').value;
            const centerMainTitle = document.getElementById('center-main-title').checked;
            const underlineHeadings = document.getElementById('underline-headings').checked;
            const firstLineIndent = document.getElementById('first-line-indent').checked;
            const boldTerms = document.getElementById('bold-terms').checked;

            // تطبيق نوع الخط والإطار على صفحة A4
            a4Page.className = `a4-page ${fontFamilyClass} ${pageBorder ? 'page-border-classic' : ''} transition-all`;
            a4Page.style.fontSize = fontSize;
            a4Page.style.lineHeight = lineHeight;

            // تحليل النص
            const elements = parseTextToElements(rawText);
            
            // تحديث الإحصائيات
            const wordCount = rawText.trim() ? rawText.trim().split(/\s+/).length : 0;
            const nonEmptyElements = elements.filter(e => e.type !== 'EMPTY').length;
            document.getElementById('stat-words').innerText = `عدد الكلمات: ${wordCount}`;
            document.getElementById('stat-paragraphs').innerText = `العناصر والفقرات: ${nonEmptyElements}`;

            if (!rawText.trim()) {
                container.innerHTML = `
                    <div class="h-96 flex flex-col items-center justify-center text-zinc-400 border-2 border-dashed border-zinc-300 rounded-lg p-6 text-center">
                        <svg class="w-12 h-12 mb-3 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                        <p class="font-bold text-base text-zinc-700">المعاينة الحية خالية حالياً</p>
                        <p class="text-xs text-zinc-500 mt-1">ضع أي نص (شكوى، مصطلحات، تقرير، محضر) في الصندوق الجانبي ليتكيف معه المحرر فوراً.</p>
                    </div>
                `;
                return;
            }

            let htmlOutput = '';

            elements.forEach(item => {
                if (item.type === 'EMPTY') {
                    htmlOutput += `<div style="height: ${paragraphGap}"></div>`;
                } else if (item.type === 'MAIN_TITLE') {
                    const alignClass = centerMainTitle ? 'text-center' : 'text-right';
                    htmlOutput += `
                        <h1 class="${alignClass} font-bold text-2xl mb-5 pb-2 border-b-2 border-black tracking-wide" style="margin-top: 10px; margin-bottom: 20px;">
                            ${escapeHtml(item.text)}
                        </h1>
                    `;
                } else if (item.type === 'HEADING') {
                    const underlineStyle = underlineHeadings ? 'text-decoration: underline; text-underline-offset: 4px;' : '';
                    htmlOutput += `
                        <h2 class="font-bold text-lg text-black mt-4 mb-2" style="${underlineStyle}">
                            ${escapeHtml(item.text)}
                        </h2>
                    `;
                } else if (item.type === 'TERM_DEF') {
                    // تنسيق مصطلح وتعريف
                    const termFontWeight = boldTerms ? 'font-bold' : 'font-semibold';
                    htmlOutput += `
                        <div class="mb-2 text-justify text-black" style="margin-bottom: ${paragraphGap};">
                            <strong class="${termFontWeight}">${escapeHtml(item.term)}:</strong>
                            <span>${escapeHtml(item.def)}</span>
                        </div>
                    `;
                } else if (item.type === 'LIST_ITEM') {
                    htmlOutput += `
                        <div class="flex items-start space-x-2 space-x-reverse my-1 pr-3">
                            <span class="font-bold text-black">•</span>
                            <span class="flex-1 text-justify text-black">${escapeHtml(item.text.replace(/^([-*•◦▪]|(\d+|[أ-ي])[\)-])\s+/, ''))}</span>
                        </div>
                    `;
                } else if (item.type === 'CLOSING') {
                    htmlOutput += `
                        <div class="text-left font-bold text-base mt-6 mb-2 pl-4" style="margin-top: 25px;">
                            ${escapeHtml(item.text)}
                        </div>
                    `;
                } else { // PARAGRAPH
                    const indentStyle = firstLineIndent ? 'text-indent: 1.2cm;' : '';
                    htmlOutput += `
                        <p class="text-justify leading-relaxed mb-3 text-black" style="${indentStyle} margin-bottom: ${paragraphGap};">
                            ${escapeHtml(item.text)}
                        </p>
                    `;
                }
            });

            container.innerHTML = htmlOutput;
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");

        function printDocument() {
            const rawText = document.getElementById('raw-text').value;
            if (!rawText.trim()) {
                showToast("⚠️ يرجى إدخال نص أولاً قبل الطباعة.");

            window.print();

        function exportToWord() {
            const rawText = document.getElementById('raw-text').value;
            if (!rawText.trim()) {
                showToast("⚠️ يرجى إدخال نص أولاً للتصدير.");
                return;
            }

            if (typeof docx === 'undefined') {
                showToast("❌ خطأ: لم يتم تحميل مكتبة Word. تحقق من الإنترنت.");
                return;
            }

            try {
                const { Document, Packer, Paragraph, TextRun, AlignmentType, UnderlineType } = window.docx;

                const centerMainTitle = document.getElementById('center-main-title').checked;
                const underlineHeadings = document.getElementById('underline-headings').checked;
                const firstLineIndent = document.getElementById('first-line-indent').checked;
                
                const fontSelect = document.getElementById('font-family');
                const fontName = fontSelect.options[fontSelect.selectedIndex].text.split(' ')[0];

                const elements = parseTextToElements(rawText);
                const docParagraphs = [];

                elements.forEach(item => {
                    if (item.type === 'EMPTY') {
                        docParagraphs.push(new Paragraph({ text: "", spaceAfter: 120 }));
                    } else if (item.type === 'MAIN_TITLE') {
                        docParagraphs.push(new Paragraph({
                            alignment: centerMainTitle ? AlignmentType.CENTER : AlignmentType.RIGHT,
                            bidirectional: true,
                            spaceBefore: 240,
                            spaceAfter: 300,
                            children: [
                                new TextRun({
                                    text: item.text,
                                    bold: true,
                                    size: 36, // 18pt
                                    font: fontName,
                                    rightToLeft: true
                                })
                            ]
                        }));
                    } else if (item.type === 'HEADING') {
                        docParagraphs.push(new Paragraph({
                            alignment: AlignmentType.RIGHT,
                            bidirectional: true,
                            spaceBefore: 200,
                            spaceAfter: 120,
                            children: [
                                new TextRun({
                                    text: item.text,
                                    bold: true,
                                    size: 30, // 15pt
                                    underline: underlineHeadings ? { type: UnderlineType.SINGLE } : undefined,
                                    font: fontName,
                                    rightToLeft: true
                                })
                            ]
                        }));
                    } else if (item.type === 'TERM_DEF') {
                        docParagraphs.push(new Paragraph({
                            alignment: AlignmentType.JUSTIFY,
                            bidirectional: true,
                            spaceAfter: 160,
                            children: [
                                new TextRun({
                                    text: item.term + ": ",
                                    bold: true,
                                    size: 28, // 14pt
                                    font: fontName,
                                    rightToLeft: true
                                }),
                                new TextRun({
                                    text: item.def,
                                    size: 28, // 14pt
                                    font: fontName,
                                    rightToLeft: true
                                })
                            ]
                        }));
                    } else if (item.type === 'CLOSING') {
                        docParagraphs.push(new Paragraph({
                            alignment: AlignmentType.LEFT,
                            bidirectional: true,
                            spaceBefore: 300,
                            spaceAfter: 120,
                            children: [
                                new TextRun({
                                    text: item.text,
                                    bold: true,
                                    size: 28, // 14pt
                                    font: fontName,
                                    rightToLeft: true
                                })
                            ]
                        }));
                    } else { // PARAGRAPH & LIST_ITEM
                        docParagraphs.push(new Paragraph({
                            alignment: AlignmentType.JUSTIFY,
                            bidirectional: true,
                            spaceAfter: 160,
                            indent: firstLineIndent && item.type === 'PARAGRAPH' ? { firstLine: 720 } : undefined,
                            children: [
                                new TextRun({
                                    text: item.text,
                                    size: 28, // 14pt
                                    font: fontName,
                                    rightToLeft: true
                                })
                            ]
                        }));
                    }
                });

                const doc = new Document({
                    sections: [{
                        properties: {
                            page: {
                                margin: {
                                    top: 1440,    // 2.54 cm
                                    bottom: 1440,
                                    left: 1440,
                                    right: 1440
                                }
                            }
                        },
                        children: docParagraphs
                    }]
                });

                Packer.toBlob(doc).then(blob => {
                    saveAs(blob, "مستند_مُنظم_المحرر_الذكي.docx");
                    showToast("📥 تم التصدير إلى Word بنجاح!");
                }).catch(err => {
                    console.error(err);
                    showToast("❌ حدث خطأ أثناء إنشاء ملف Word");
                });

            } catch (e) {
                console.error(e);
                showToast("❌ تعذر تصدير الملف: " + e.message);
            }
        }

                editorBtn.className = 'flex-1 py-2 text-center text-sm font-semibold rounded text-zinc-400';
            }
        }

            const toast = document.getElementById('toast');
            document.getElementById('toast-message').innerText = message;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none');
